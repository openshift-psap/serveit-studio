name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Ruff check
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Create state directory
        run: sudo mkdir -p /mnt/serveit-state && sudo chmod 777 /mnt/serveit-state
      - name: Install dependencies
        run: |
          pip install \
            Flask \
            Flask-SocketIO \
            gevent \
            gevent-websocket \
            Jinja2 \
            PyYAML \
            requests \
            httpx \
            openai \
            optuna \
            kubernetes \
            plotly \
            pandas \
            werkzeug \
            transformers \
            mlflow \
            pytest
      - name: Run tests
        run: pytest tests/ -v
