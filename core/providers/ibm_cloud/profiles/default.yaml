# IBM Cloud - Default Profile
# Standard IBM Cloud deployment with 1 pod per node limit

name: default
description: "Standard IBM Cloud deployment (1 pod per node limit)"

# Pod scheduling constraints
constraints:
  max_prefill_pods_per_node: 1
  max_decode_pods_per_node: 1
  max_total_pods_per_node: 1
  supports_rdma: true
  supports_pod_affinity: true
  supports_node_affinity: true
  supports_multi_pod_per_node: false

# Network configuration
network:
  rdma_type: virtio-roce
  rdma_device_plugin: nvidia.com/roce
  requires_cni: false
  max_bandwidth_gbps: 400
  expected_latency_us: 2.0

# Template overrides for PD deployments
template_overrides:
  pd:
    # IBM-specific pod annotations
    pod_annotations:
      ibm.io/rdma-enabled: "true"

    # Force anti-affinity (prefill and decode on separate nodes)
    anti_affinity_required: true

    # Resource limits (fallback defaults; overridden by dynamic calculation)
    resources:
      requests:
        memory: "64Gi"
      limits:
        memory: "64Gi"

# Enabled architectures
enabled_architectures:
  - aggregated
  - pd
  - ep

# Provider-specific configuration
config:
  dranet_enabled: false

  # Only 1:1 ratio works without DRANET
  recommended_ratios:
    - "1:1"

  # IBM Cloud notes
  notes: |
    Standard IBM Cloud OpenShift deployments have a 1 pod per node limit
    for disaggregated serving. This means:
    - Prefill and decode pods CANNOT coexist on the same node
    - Only 1:1 PD ratio works efficiently (requires 2+ nodes)
    - For other ratios (1:2, 1:4, etc.), use the 'dranet' profile

