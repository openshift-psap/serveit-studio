<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inftune Studio - Setup</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23EE0000'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-weight='900' font-size='28' fill='white' text-anchor='middle'%3ES8%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700;800;900&family=Red+Hat+Mono:wght@400;500;600;700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Red Hat Display', sans-serif;
            background: #F5F5F5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            width: 380px;
            overflow: hidden;
        }
        .login-header {
            background: #2A7B88;
            padding: 32px 32px 28px;
            text-align: center;
        }
        .login-header h1 {
            font-family: 'Syne', sans-serif;
            color: #fff;
            font-size: 1.8em;
            font-weight: 900;
        }
        .login-header p {
            color: rgba(255,255,255,0.85);
            font-size: 0.9em;
            margin-top: 4px;
            font-weight: 500;
        }
        .login-body {
            padding: 32px;
        }
        .setup-note {
            background: #EFF6FF;
            color: #1E40AF;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.88em;
            font-weight: 600;
            margin-bottom: 20px;
            border-left: 4px solid #3B82F6;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.85em;
            color: #1A1A1A;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #E0E0E0;
            border-radius: 6px;
            font-size: 0.95em;
            font-family: 'Red Hat Display', sans-serif;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2A7B88;
            box-shadow: 0 0 0 3px rgba(42,123,136,0.1);
        }
        .login-button {
            width: 100%;
            padding: 12px;
            background: #2A7B88;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 800;
            font-family: 'Red Hat Display', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-button:hover { background: #1B5E6B; }
        .error-msg {
            background: #FEE2E2;
            color: #991B1B;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.88em;
            font-weight: 600;
            margin-bottom: 20px;
            border-left: 4px solid #2A7B88;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>Inftune Studio</h1>
            <p>Initial Setup</p>
        </div>
        <div class="login-body">
            <div class="setup-note">Create your admin account to get started.</div>
            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}
            <form method="POST" action="/setup">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" autocomplete="username" autofocus required minlength="3">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" autocomplete="new-password" required minlength="6">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirm_password" autocomplete="new-password" required minlength="6">
                </div>
                <button type="submit" class="login-button">Create Account</button>
            </form>
        </div>
    </div>
</body>
</html>
