recipe_id: glm53-pd-asymmetric
name: "GLM-5.3 asymmetric P/D — TP16 prefill / TP8 decode"
description: >
  Prefill/Decode disaggregation with heterogeneous TP: compute-bound
  prefill at TP16 (two nodes) and latency-bound decode at TP8. Requires
  a vLLM image with heterogeneous MLA TP support (mixed MLA + DSA
  indexer models crash the default image on the first KV transfer) —
  the image is pinned in the config. 68% throughput improvement over
  the best symmetric split in validation.
model: zai-org/GLM-5.3
goal: pd_only
requires:
  min_gpus: 24
  gpu_memory_gb: 140
  network: [rdma]
evidence:
  tested_on: "kermit — 8xH200 per node"
  results:
    best_config: "1P x TP16 + 2D x TP8"
    throughput: "0.81 req/s (vs 0.48 best symmetric, +68%)"
    ttft_p90_ms: 2724
  source: "ServeIt run #48; vllm PR #61581"
