recipe_id: glm53-dpep-production
name: "GLM-5.3 DPEP — production parity"
description: >
  Data Parallel + Expert Parallel (TP=1, DP per node, EP with
  --enable-ep-weight-filter) matching the production rits-roce-h100
  deployment architecture. Each GPU holds full attention weights plus a
  slice of the MoE experts; per-role DeepEP all-to-all backends
  (high-throughput prefill / low-latency decode), MTP speculation.
  Validated on kermit (8xH200 nodes, shared-device RDMA).
model: zai-org/GLM-5.3
goal: dpep_only
requires:
  min_gpus: 16
  gpu_memory_gb: 140
  network: [rdma]
